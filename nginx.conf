server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api vers le backend sur Render
    location /api/ {
        proxy_pass https://sigchamp-backend.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host sigchamp-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
