server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for any non-file route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api to the backend when running behind the same host.
    # If your frontend uses an absolute REACT_APP_BACKEND_URL, you can remove this block.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
