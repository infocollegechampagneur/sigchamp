services:
  # ---------------------------------------------------------------------------
  # Backend FastAPI — 100 % autonome (stockage local sur disque, sans Emergent)
  # ---------------------------------------------------------------------------
  - type: web
    name: sigchamp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter            # requis pour attacher un disque persistant (le plan free n'a pas de disque)
    disk:
      name: sigchamp-storage
      mountPath: /data/storage
      sizeGB: 1
    envVars:
      - key: MONGO_URL
        sync: false          # collez votre chaîne de connexion MongoDB Atlas
      - key: DB_NAME
        value: sigchamp
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false          # ex. informatique@votredomaine.com
      - key: ADMIN_PASSWORD
        sync: false
      # --- Stockage autonome (aucune dépendance Emergent) ---
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /data/storage
      # --- Récupération auto des scripts M365 (optionnel) ---
      - key: DEPLOY_API_TOKEN
        generateValue: true
      # URL publique du backend (indispensable : les images des signatures sont chargées via cette URL)
      - key: REACT_APP_BACKEND_URL
        sync: false          # = URL publique de CE service, ex. https://sigchamp-backend.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend React (build statique servi par nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: sigchamp-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: free
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false          # = URL publique du backend ci-dessus (figée au build)
