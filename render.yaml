services:
  # ---------------------------------------------------------------------------
  # Backend FastAPI — 100 % gratuit et autonome
  # (images hébergées ailleurs, ex. SiteGround → le disque local peut être éphémère)
  # ---------------------------------------------------------------------------
  - type: web
    name: sigchamp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free               # gratuit (le service se met en veille après inactivité)
    envVars:
      - key: MONGO_URL
        sync: false          # collez votre chaîne de connexion MongoDB Atlas
      - key: DB_NAME
        value: sigchamp
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false          # ex. informatique@champagneur.qc.ca
      - key: ADMIN_PASSWORD
        sync: false
      # --- Stockage autonome (aucune dépendance Emergent) ---
      - key: STORAGE_BACKEND
        value: local
      # --- Récupération auto des scripts M365 (optionnel) ---
      - key: DEPLOY_API_TOKEN
        generateValue: true
      # URL publique de CE service backend (indispensable pour l'app)
      - key: REACT_APP_BACKEND_URL
        sync: false          # ex. https://sigchamp-backend.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend React (servi par nginx)
  # ---------------------------------------------------------------------------
  - type: web
    name: sigchamp-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: free
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false          # = URL publique du backend ci-dessus (figée au build)
